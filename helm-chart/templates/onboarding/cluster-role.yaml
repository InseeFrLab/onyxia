{{- if and .Values.onboarding.enabled .Values.onboarding.clusterRole.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.onboarding.clusterRole.name | default (include "onyxia.onboarding.fullname" .) }}
  labels:
    {{- include "onyxia.onboarding.labels" . | nindent 4 }}
rules:
  {{- toYaml .Values.onboarding.clusterRole.rules | nindent 2 }}
{{- end }}
