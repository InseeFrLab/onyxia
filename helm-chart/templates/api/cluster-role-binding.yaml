{{- include "onyxia.api.rbac.checkDeprecated" . }}
{{- include "onyxia.api.rbac.checkMultiNamespaceMode" . }}
{{- if and .Values.api.enabled (include "onyxia.api.clusterRoleBinding.create" .) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.api.clusterRoleBinding.name | default (include "onyxia.api.fullname" .) }}
  labels:
    {{- include "onyxia.api.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "onyxia.api.rbac.roleRefName" (dict "binding" .Values.api.clusterRoleBinding "fallback" "cluster-admin" "context" $) }}
subjects:
- kind: ServiceAccount
  name: {{ include "onyxia.api.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
