{{- if and .Values.api.enabled (include "onyxia.api.roleBinding.create" .) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.api.roleBinding.name | default (include "onyxia.api.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "onyxia.api.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "onyxia.api.rbac.roleRefName" (dict "binding" .Values.api.roleBinding "fallback" "admin" "context" $) }}
subjects:
- kind: ServiceAccount
  name: {{ include "onyxia.api.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
